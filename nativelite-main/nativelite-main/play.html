
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#a80000" />
  <title>woahpassed</title>

  <link rel="stylesheet" href="config/main.css" />
  <script src="config/main.js" type="module"></script>

  <style>
    :root {
      --page-bg: #a80000;
      --accent: #f74b4b;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --surface: rgba(20, 0, 0, 0.28);
      --border: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--text);
      font-family: "Ubuntu", sans-serif;
    }

    button, a {
      font-family: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }

    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 30px 24px 55px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 25px;
    }

    .brand {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    .brand span {
      color: #ffc1c1;
    }

    .return-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(30, 0, 0, 0.24);
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.18s, transform 0.18s;
    }

    .return-button:hover {
      background: rgba(255, 255, 255, 0.13);
      transform: translateY(-1px);
    }

    .game-shell {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #160303;
      box-shadow: 0 18px 55px rgba(35, 0, 0, 0.25);
    }

    .game-toolbar {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 15px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.15);
    }

    .game-status {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      color: var(--muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #7df2a8;
      box-shadow: 0 0 9px rgba(125, 242, 168, 0.45);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      color: white;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
    }

    .tool-button:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .tool-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .tool-button.primary:hover {
      background: #ff6262;
    }

    .game-viewport {
      position: relative;
      width: 100%;
      height: min(68vw, 650px);
      min-height: 340px;
      background: #090909;
    }

    #gameFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #090909;
    }

    .game-info {
      padding: 28px 4px 0;
    }

    .game-category {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 13px;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 7px;
      background: rgba(35, 0, 0, 0.18);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .game-info h1 {
      margin: 0 0 12px;
      font-size: clamp(27px, 4vw, 38px);
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .game-description {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.85;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .info-divider {
      height: 1px;
      margin: 25px 0 17px;
      background: var(--border);
    }

    .bottom-note {
      color: rgba(255, 255, 255, 0.62);
      font-size: 12px;
      line-height: 1.7;
    }

    /* fullscreen controls */

    .game-viewport:fullscreen {
      width: 100%;
      height: 100%;
      min-height: 0;
      background: #000;
    }

    .game-viewport:fullscreen #gameFrame {
      width: 100%;
      height: 100%;
    }

    .fullscreen-bar {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 5;
      display: none;
      align-items: center;
      gap: 12px;
      padding: 6px 8px 6px 13px;
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 9px;
      background: rgba(15, 15, 18, 0.88);
      color: white;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 5px 24px rgba(0, 0, 0, 0.22);
    }

    .fullscreen-bar.visible {
      display: flex;
    }

    .lite-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      opacity: 0.9;
    }

    .exit-fullscreen {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: white;
      font-size: 21px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .exit-fullscreen:hover {
      background: var(--accent);
    }

    @media (max-width: 600px) {
      .page {
        padding: 19px 12px 35px;
      }

      .page-header {
        align-items: flex-start;
        margin-bottom: 18px;
      }

      .brand {
        padding-top: 9px;
        font-size: 20px;
      }

      .return-button {
        min-height: 38px;
        padding: 0 11px;
        font-size: 12px;
      }

      .game-toolbar {
        padding: 9px;
      }

      .game-status {
        gap: 6px;
        font-size: 11px;
      }

      .toolbar-actions {
        gap: 5px;
      }

      .tool-button {
        min-height: 32px;
        padding: 7px 9px;
        font-size: 11px;
      }

      .game-viewport {
        height: 58vh;
        min-height: 270px;
      }

      .game-info {
        padding-top: 23px;
      }

      .fullscreen-bar {
        top: 9px;
        right: 9px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="page-header">
      <div class="brand">woahpassed<span>.</span></div>

      <a class="return-button" href="/">
        <span aria-hidden="true">←</span>
        return to home
      </a>
    </header>

    <section class="game-shell">
      <div class="game-toolbar">
        <div class="game-status">
          <span class="status-dot"></span>
          <span>game player</span>
        </div>

        <div class="toolbar-actions">
          <button class="tool-button" id="reloadButton" type="button">
            ↻ reload
          </button>

          <button
            class="tool-button primary"
            id="fullscreenButton"
            type="button"
          >
            ⛶ fullscreen
          </button>
        </div>
      </div>

      <div class="game-viewport" id="gameViewport">
        <iframe
          id="gameFrame"
          title="Game player"
          allow="fullscreen; autoplay; gamepad"
          allowfullscreen
        ></iframe>

        <div class="fullscreen-bar" id="fullscreenBar">
          <span class="lite-label">LITE</span>

          <button
            class="exit-fullscreen"
            id="exitFullscreenButton"
            type="button"
            aria-label="Exit fullscreen"
            title="Exit fullscreen"
          >×</button>
        </div>
      </div>
    </section>

    <section class="game-info">
      <div class="game-category" id="gameCategory">
        🎮 featured game
      </div>

      <h1 id="gameName">loading game...</h1>

      <p class="game-description" id="gameDescription">
        your game description will appear here.
      </p>

      <div class="info-divider"></div>

      <div class="bottom-note">
        game not loading correctly? try reloading it or opening it in fullscreen.
      </div>
    </section>
  </main>

  <script>
    const serverUrl = "https://gms.parcoil.com";
    const params = new URLSearchParams(window.location.search);

    const gameUrl = params.get("gameurl");
    const gameName = params.get("name") || "untitled game";
    const description =
      params.get("description") || "jump in and start playing.";
    const category = params.get("category") || "featured game";

    const frame = document.getElementById("gameFrame");
    const viewport = document.getElementById("gameViewport");
    const fullscreenButton = document.getElementById("fullscreenButton");
    const exitFullscreenButton =
      document.getElementById("exitFullscreenButton");
    const fullscreenBar = document.getElementById("fullscreenBar");
    const reloadButton = document.getElementById("reloadButton");

    document.getElementById("gameName").textContent = gameName;
    document.getElementById("gameDescription").textContent = description;
    document.getElementById("gameCategory").textContent = "🎮 " + category;
    document.title = gameName + " | woahpassed";

    if (!gameUrl) {
      alert("Game URL not provided!");
      window.location.href = "/";
    } else {
      // Preserve compatibility with the existing game server.
      frame.src = `${serverUrl}/${gameUrl}`;
    }

    async function enterFullscreen() {
      try {
        if (document.fullscreenElement) return;

        await viewport.requestFullscreen();
      } catch (error) {
        console.error("Could not enter fullscreen:", error);
      }
    }

    async function exitFullscreen() {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.error("Could not exit fullscreen:", error);
      }
    }

    fullscreenButton.addEventListener("click", enterFullscreen);
    exitFullscreenButton.addEventListener("click", exitFullscreen);

    document.addEventListener("fullscreenchange", () => {
      const isFullscreen = document.fullscreenElement === viewport;

      fullscreenBar.classList.toggle("visible", isFullscreen);
      fullscreenButton.textContent = isFullscreen
        ? "⊡ exit fullscreen"
        : "⛶ fullscreen";
    });

    reloadButton.addEventListener("click", () => {
      if (frame.src) {
        frame.src = frame.src;
      }
    });
  </script>
</body>
</html>
